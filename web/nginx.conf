server {
    listen 80;

    # SPA — serve index.html for all routes
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Public downloads (Android agent APK). Bind-mounted from ./downloads/ on
    # the host. Returns 404 cleanly if the file isn't there — does NOT fall
    # through to the SPA, so missing.apk won't return index.html.
    location /downloads/ {
        root /usr/share/nginx/html;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment';
    }

    # Proxy API requests to the api service
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy SignalR WebSocket to the api service
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
