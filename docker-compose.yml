services:
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=remotedesktop
      - POSTGRES_USER=${DB_USER:-rdadmin}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
    volumes:
      - pg-data:/var/lib/postgresql/data
    # No public port mapping. Postgres is reachable from the api service over
    # the internal app-net network only. For local-machine psql access during
    # dev, add a ports: ["127.0.0.1:5432:5432"] override in compose.override.yml.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rdadmin} -d remotedesktop"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    # Bound to loopback only — the public-facing path is via the web service's
    # nginx (/api and /hubs paths proxy to api:8080 over app-net). The
    # 127.0.0.1 binding lets you curl localhost:5000 on the host for debugging
    # without exposing the API to the internet.
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - JWT_SECRET=${JWT_SECRET:-dev_secret_replace_in_production_at_least_32_chars}
      - ConnectionStrings__Default=Host=db;Port=5432;Database=remotedesktop;Username=${DB_USER:-rdadmin};Password=${DB_PASSWORD:-changeme}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      # Pairing — phone-reachable URL embedded in the QR code (see .env.example).
      - Pairing__BaseUrl=${PAIRING_BASE_URL:-}
      # TURN is OFF by default. Backend serves Cloudflare's public STUN
      # automatically; that's sufficient for direct P2P with NAT traversal.
      # To enable self-hosted or hosted TURN, set both vars below — when set,
      # the backend mints ephemeral credentials and adds TURN to iceServers.
      - Turn__Secret=${TURN_SECRET:-}
      - Turn__Hostname=${TURN_HOSTNAME:-}
      - Turn__Port=${TURN_PORT:-3478}
      # Initial admin seeded on first boot only (no-op once the Users table
      # has any row). Both required in production; otherwise the seed falls
      # back to admin/admin and logs a loud warning.
      - Admin__Email=${ADMIN_EMAIL:-}
      - Admin__Password=${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
      - "${WEB_TLS_PORT:-443}:443"
    volumes:
      # Cloudflare Origin Certificate (origin.pem + origin-key.pem) lands here.
      # nginx.prod.conf references these paths.
      - ./certs:/etc/nginx/certs:ro
      # Production nginx config — terminates TLS on 443, redirects 80→443.
      # docker-compose.override.yml overrides this mount with the plain-HTTP
      # nginx.conf for LAN dev.
      - ./web/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app-net

  # NOTE: no coturn service. The backend hands clients Cloudflare's public
  # STUN server (stun:stun.cloudflare.com:3478) for NAT traversal; direct
  # peer-to-peer WebRTC works for the vast majority of NAT configurations
  # without needing a media relay. If you later want TURN fallback for the
  # rare symmetric-NAT or UDP-blocked cases, either self-host coturn on a
  # second VPS or use a hosted service (Twilio, Metered.ca, etc.) and set
  # TURN_SECRET + TURN_HOSTNAME in .env — the backend already supports
  # appending TURN entries to iceServers when those are configured.

volumes:
  pg-data:

networks:
  app-net:
